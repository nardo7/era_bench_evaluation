dataset:
  paths:
    - ../../era_bench/datasets/era_bench.backup.hdf5
  # The recordings are 20 Hz; stride 20 gives approximately 1 fps.
  frame_stride: 20
  sampled_fps: 1.0

model:
  id: Qwen/Qwen3-VL-8B-Thinking
  served_name: qwen3-vl-8b
  vllm_executable: vllm
  # Keys are passed directly to `vllm serve` as `--<key> <value>`.
  vllm_args:
    dtype: auto
    max-model-len: 32768
    gpu-memory-utilization: 0.95
    reasoning-parser: qwen3
    reasoning-config:
      reasoning_start_str: "<think>"
      reasoning_end_str: "I have enough information. I will now provide the final answer.</think>"
    # One video modality per demonstration and one test image.
    limit-mm-per-prompt:
      video: 10
      # Ten demonstrations with initial/final images plus the test image.
      image: 21

server:
  base_url: http://127.0.0.1:8000/v1
  # Leave null unless vLLM is launched with --api-key.
  api_key: null
  timeout_seconds: 300

generation:
  # Hybrid action objects are verbose; this covers a dense 8x8 output plan.
  max_tokens: 16384
  # vLLM supports OpenAI's newer completion-token field and request seed.
  max_tokens_field: max_completion_tokens
  # Deterministic decoding is preferable for evaluation. It still generates a
  # new plan for the test input; it is not a demonstration-copying mechanism.
  seed: 0
  temperature: 0.6
  top_p: 0.95
  structured_output: true
  # Additional Chat Completions request fields are passed through unchanged.
  request_overrides:
    thinking_token_budget: 12288
    top_k: 20
    enable_thinking: true
    presence_penalty: 1.7
    mm_processor_kwargs:
      # A scalar applies the same sampling rate to every demonstration video.
      fps: 1.0

evaluation:
  # embodied predicts actions; grid_focused predicts an output grid.
  prompt_mode: grid_focused
  induce_rule_summary: false
  # Frames add every demonstration video and the initial test image.
  include_frames: false
  # Add demo input/output grids and the test input grid as text.
  include_textual_grids: true
  include_actions: false
  output_dir: ../outputs/qwen3_vl_8b_thinking
  # Keep the first run small; set to null to evaluate the full dataset.
  max_samples: 30
  continue_on_error: false
