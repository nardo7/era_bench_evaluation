dataset:
  paths:
    - ../data/era_bench_background2.hdf5
  frame_stride: 20
  sampled_fps: 1.0

# Resolved relative to this configuration file; copy ../.env.example to ../.env.
env_file: ../.env

model:
  # OpenRouter uses provider-qualified model slugs.
  id: openai/gpt-5.6-luna
  served_name: openai/gpt-5.6-luna

server:
  base_url: https://openrouter.ai/api/v1
  # Export this variable before running; never store the key in this file.
  api_key_env_name: OPENROUTER_API_KEY
  timeout_seconds: 300

generation:
  max_tokens: 4096
  # GPT-5.6 Luna does not support temperature or top_p through OpenRouter.
  max_tokens_field: max_tokens
  temperature: null
  top_p: null
  seed: null
  structured_output: true
  request_overrides:
    # Route only to endpoints that support requested parameters such as the
    # JSON schema response format and disabled reasoning used by this evaluator.
    provider:
      require_parameters: true
    reasoning:
      effort: none

evaluation:
  cameras: [table_cam, origin_top_cam]
  prompt_mode: embodied
  induce_rule_summary: true
  induce_scene_descriptions: true
  # Text-only is the safest initial cloud smoke test. To send standard PNG
  # inputs, set this false and include_final_frames to true.
  include_frames: false
  include_final_frames: true
  include_textual_grids: true
  include_actions: true

  output_dir: ../outputs/openrouter_gpt_5_6_luna
  max_samples: 77
  continue_on_error: false
