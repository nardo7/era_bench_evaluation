dataset:
  paths:
    - ../../data/era_bench_background2.hdf5
  # The recordings are 20 Hz; stride 20 gives approximately 1 fps.
  frame_stride: 20
  sampled_fps: 1.0

model:
  id: Qwen/Qwen3.8-27B
  served_name: qwen3-8-27b
  vllm_executable: vllm
  # Keys are passed directly to `vllm serve` as `--<key> <value>`.
  vllm_args:
    dtype: auto
    tensor-parallel-size: 1
    max-model-len: 49152
    gpu-memory-utilization: 0.98
    reasoning-parser: qwen3
    default-chat-template-kwargs:
      enable_thinking: false
    # One video modality per demonstration and one test image.
    limit-mm-per-prompt:
      video: 10
      # Ten demonstrations with initial/final images plus the test image.
      image: 24

server:
  base_url: http://127.0.0.1:8000/v1
  # Leave null unless vLLM is launched with --api-key.
  api_key: null
  timeout_seconds: 300

generation:
  # Hybrid action objects are verbose; this covers a dense 8x8 output plan.
  max_tokens: 4096
  # Match the fields sent by the OpenRouter experiment. OpenRouter forwards
  # explicitly supplied sampling values to providers unchanged.
  max_tokens_field: max_tokens
  temperature: 0.0
  top_p: 1.0
  structured_output: true
  # Additional Chat Completions request fields are passed through unchanged.
  request_overrides:
    # Qwen3.8 thinks by default; this is the vLLM equivalent of OpenRouter's
    # reasoning.effort: none. It also overrides the server default per request.
    chat_template_kwargs:
      enable_thinking: false
    # Qwen3.8's generation config and OpenRouter model defaults use top_k 20.
    top_k: 20
    mm_processor_kwargs:
      # A scalar applies the same sampling rate to every demonstration video.
      fps: 1.0

evaluation:
  cameras: [table_cam, origin_top_cam]
  # embodied predicts actions; grid_focused predicts an output grid.
  prompt_mode: embodied
  induce_rule_summary: true
  induce_scene_descriptions: true
  include_frames: true
  include_final_frames: true
  include_textual_grids: false
  include_actions: true
  output_dir: ../outputs/qwen3_8_27b
  # Keep the first run small; set to null to evaluate the full dataset.
  max_samples: 77
  continue_on_error: false
